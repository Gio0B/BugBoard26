<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Mock-up Material 3 per archiviare una issue</title>
  <desc id="desc">Finestra modale amministrativa che conferma l'archiviazione logica.</desc>
  <defs><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="26" flood-color="#101018" flood-opacity=".24"/></filter></defs>
  <rect width="1440" height="900" fill="#f9f7ff"/>
  <rect x="28" y="24" width="1384" height="76" rx="26" fill="#eceeff"/>
  <text x="70" y="69" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="750" fill="#1a1b25">Dettaglio issue</text>
  <rect x="1224" y="42" width="154" height="40" rx="14" fill="#e3f7ef"/><text x="1301" y="68" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#1d5c4b">ADMIN</text>
  <rect x="70" y="142" width="1300" height="690" rx="30" fill="white"/>
  <rect x="112" y="184" width="96" height="38" rx="13" fill="#ffdad6"/>
  <text x="160" y="209" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="800" fill="#8c1d18">BUG</text>
  <text x="112" y="278" font-family="Inter,Segoe UI,sans-serif" font-size="34" font-weight="760" fill="#1a1b25">Il login scade durante il salvataggio</text>
  <rect x="112" y="326" width="810" height="170" rx="22" fill="#f5f3fb"/>
  <rect x="112" y="540" width="810" height="160" rx="22" fill="#eef0ff"/>
  <rect x="1020" y="326" width="300" height="56" rx="18" fill="#fff" stroke="#ba1a1a"/>
  <text x="1170" y="361" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#9b1616">Archivia issue</text>

  <rect width="1440" height="900" fill="#1a1b25" opacity=".48"/>
  <rect x="410" y="218" width="620" height="464" rx="34" fill="#fff" filter="url(#shadow)"/>
  <circle cx="474" cy="286" r="28" fill="#ffdad6"/>
  <path d="M462 278h24M466 278v23h16v-23M470 272h8" fill="none" stroke="#8c1d18" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="522" y="296" font-family="Inter,Segoe UI,sans-serif" font-size="29" font-weight="780" fill="#1a1b25">Archiviare questa issue?</text>
  <text x="466" y="362" font-family="Inter,Segoe UI,sans-serif" font-size="17" fill="#454653">“Il login scade durante il salvataggio” non comparirà</text>
  <text x="466" y="392" font-family="Inter,Segoe UI,sans-serif" font-size="17" fill="#454653">più nella lista attiva.</text>
  <rect x="466" y="430" width="508" height="110" rx="20" fill="#eef0ff"/>
  <circle cx="504" cy="466" r="15" fill="#465dff"/>
  <path d="M497 466l5 5 9-11" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="534" y="467" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#263a9b">Nessun dato sarà eliminato</text>
  <text x="534" y="497" font-family="Inter,Segoe UI,sans-serif" font-size="14" fill="#4d5790">Issue e commenti resteranno disponibili nell'Archivio.</text>
  <rect x="680" y="582" width="126" height="56" rx="19" fill="white" stroke="#465dff"/>
  <text x="743" y="617" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#263a9b">Annulla</text>
  <rect x="822" y="582" width="152" height="56" rx="19" fill="#ba1a1a"/>
  <text x="898" y="617" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="white">Archivia issue</text>

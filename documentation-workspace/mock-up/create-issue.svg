<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Mock-up Material 3 per la creazione di una issue</title>
  <desc id="desc">Navigazione laterale, modulo in primo piano e pannello di supporto.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#1b1b25" flood-opacity=".10"/></filter>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5267ff"/><stop offset="1" stop-color="#8a5cff"/></linearGradient>
  </defs>
  <rect width="1440" height="900" fill="#f9f7ff"/>
  <rect x="20" y="20" width="88" height="860" rx="32" fill="#eceeff"/>
  <rect x="36" y="38" width="56" height="56" rx="18" fill="url(#brand)"/>
  <text x="64" y="74" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="white">B</text>
  <rect x="36" y="142" width="56" height="56" rx="20" fill="#dce2ff"/>
  <path d="M49 170h30M64 155v30" stroke="#243890" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="240" r="7" fill="#737684"/><path d="M48 258h32" stroke="#737684" stroke-width="3" stroke-linecap="round"/>
  <path d="M49 314h30M49 324h22" stroke="#737684" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="842" r="20" fill="#283045"/><text x="64" y="848" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="white">G</text>

  <text x="148" y="62" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#555866">BUGBOARD26</text>
  <text x="148" y="120" font-family="Inter,Segoe UI,sans-serif" font-size="38" font-weight="750" fill="#1a1b25">Nuova issue</text>
  <text x="148" y="150" font-family="Inter,Segoe UI,sans-serif" font-size="16" fill="#5f606d">Descrivi il problema in modo che il team possa agire.</text>

  <rect x="148" y="180" width="834" height="650" rx="28" fill="white" filter="url(#shadow)"/>
  <text x="184" y="226" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#555866">TITOLO</text>
  <rect x="184" y="244" width="762" height="64" rx="16" fill="#f5f3fb" stroke="#777986"/>
  <text x="206" y="283" font-family="Inter,Segoe UI,sans-serif" font-size="16" fill="#2f303b">Il login scade durante il salvataggio</text>
  <text x="184" y="348" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#555866">DESCRIZIONE</text>
  <rect x="184" y="366" width="762" height="132" rx="16" fill="#f5f3fb" stroke="#777986"/>
  <text x="206" y="405" font-family="Inter,Segoe UI,sans-serif" font-size="16" fill="#2f303b">Dopo circa 60 minuti, il salvataggio restituisce 401.</text>
  <text x="206" y="434" font-family="Inter,Segoe UI,sans-serif" font-size="16" fill="#2f303b">Il contenuto inserito deve restare disponibile.</text>
  <text x="184" y="538" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#555866">TIPO</text>
  <g font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="650">
    <rect x="184" y="556" width="128" height="48" rx="16" fill="#f0eef6"/><text x="248" y="586" text-anchor="middle" fill="#454653">Domanda</text>
    <rect x="324" y="556" width="110" height="48" rx="16" fill="#dce2ff" stroke="#465dff" stroke-width="2"/><text x="379" y="586" text-anchor="middle" fill="#20358e">Bug</text>
    <rect x="446" y="556" width="172" height="48" rx="16" fill="#f0eef6"/><text x="532" y="586" text-anchor="middle" fill="#454653">Documentazione</text>
    <rect x="630" y="556" width="142" height="48" rx="16" fill="#f0eef6"/><text x="701" y="586" text-anchor="middle" fill="#454653">Funzionalità</text>
  </g>
  <text x="184" y="646" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#555866">PRIORITÀ</text>
  <rect x="184" y="664" width="448" height="50" rx="18" fill="#f0eef6"/>
  <rect x="407" y="668" width="108" height="42" rx="14" fill="#ffdcc2"/>
  <g font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="650" fill="#454653">
    <text x="239" y="695">Bassa</text><text x="340" y="695">Media</text><text x="438" y="695" fill="#5b2b09">Alta</text><text x="538" y="695">Critica</text>
  </g>
  <rect x="692" y="752" width="106" height="52" rx="18" fill="white" stroke="#465dff"/>
  <text x="745" y="784" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#263a9b">Annulla</text>
  <rect x="814" y="752" width="132" height="52" rx="18" fill="#465dff"/>
  <text x="880" y="784" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="white">Crea issue</text>

  <rect x="1014" y="180" width="378" height="330" rx="28" fill="#e3f7ef"/>
  <circle cx="1060" cy="228" r="20" fill="#1d6b55"/><path d="M1051 228l6 6 12-14" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1092" y="235" font-family="Inter,Segoe UI,sans-serif" font-size="21" font-weight="750" fill="#123c31">Prima di pubblicare</text>
  <g font-family="Inter,Segoe UI,sans-serif" font-size="16" fill="#244b40">
    <text x="1050" y="290">• Usa un titolo specifico</text>
    <text x="1050" y="330">• Aggiungi risultato atteso e ottenuto</text>
    <text x="1050" y="370">• Non inserire dati sensibili</text>
    <text x="1050" y="410">• Scegli la priorità reale</text>
  </g>
  <rect x="1014" y="534" width="378" height="138" rx="28" fill="#f0eef6"/>
  <text x="1050" y="578" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#555866">STATO INIZIALE</text>
  <rect x="1050" y="597" width="98" height="40" rx="14" fill="#e0e3ff"/>
  <text x="1099" y="623" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#263a9b">Da fare</text>
  <text x="1164" y="623" font-family="Inter,Segoe UI,sans-serif" font-size="14" fill="#5f606d">Impostato dal sistema</text>
</svg>
